<!-- @if(vista()===1) { -->

<div class="hero min-h-screen bg-gradient-to-br from-base-200 to-base-100">
  <div class="hero-content flex-col lg:flex-row">

    <!-- Lado formulario -->
    <div class="card bg-base-100 w-full max-w-md shadow-xl border border-base-300">
      <div class="card-body space-y-4">
        <h1 class="text-4xl font-bold text-center text-primary">VetLink</h1>
        <h2 class="text-3xl font-bold text-center text-primary">Restablecer Contraseña</h2>
        <span>{{leyenda}}</span>

        <fieldset class="fieldset space-y-3">
          @if (vista()===1) {
          <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
            <label class="label font-semibold">Correo electrónico</label>
            <input type="email" class="input input-bordered w-full"
              placeholder="ingrese su dirección de correo electrónico" formControlName="email" required />
            @if (formUtils.isValidField(myForm, 'email')){
            <small class="text-error">{{ formUtils.getFieldError(myForm, 'email') }}</small>
            }

            <button class="btn btn-primary w-full mt-4" [disabled]="loading">
              @if (!loading) {
              Enviar correo electrónico
              } @else {
              <span class="loading loading-spinner loading-sm"></span>
              }
            </button>
          </form>
          } @else {
          <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <label class="label font-semibold">Correo electrónico</label>
            <input type="email" class="input w-full" placeholder="Correo electrónico" formControlName="email"/>

            <label class="label font-semibold">Token</label>
            <input type="text" class="input w-full" placeholder="Token" formControlName="token"/>

            <label class="label font-semibold">Nueva contraseña</label>
            <input type="password" class="input w-full" placeholder="Nueva contraseña" formControlName="newPassword"/>

            <button class="btn btn-primary mt-4">Aceptar</button>
          </form>
          }
        </fieldset>
      </div>
    </div>
  </div>
</div>
