<div class="bg-white rounded-lg shadow-md">
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Sucursales</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="refrescaDatos()" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
      <a routerLink="/admin/sucursales/new" class="btn btn-primary">
        <shared-icon-add />
        Nuevo
      </a>
    </div>
  </section>
  <div class="overflow-x-hidden">
    <table class="table ml-5">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Sucursal</th>
          <th>Contacto</th>
          <th>Estatus</th>
          <th>Editar</th>
          <th>Eliminar</th>
        </tr>
      </thead>
      <tbody>
        @for (sucursal of sucursalesResource.value(); track sucursal.id) {
        <tr>
          <td>{{sucursal.id}}</td>
          <td>
            <div class="flex items-center gap-3">
              <div class="avatar">
                <div class="mask mask-squircle h-12 w-12">
                  <img src="/assets/images/veterinaria/clinica.jpg" [alt]="sucursal.nombreSucursal"
                    class="object-contain " />
                  <!-- <img src="/assets/images/veterinaria/clinica.jpg" alt="Veterinaria" class="object-cover w-full h-full" /> -->
                </div>
              </div>
              <div>
                <div class="font-bold">{{sucursal.nombreSucursal}}</div>
                <div class="text-sm opacity-50">{{sucursal.horario}}</div>
              </div>
            </div>
          </td>
          <td>
            {{sucursal.email}}
            <br />
            <span class="badge badge-ghost badge-sm">Tel: {{sucursal.telefono}}</span>
          </td>
          <td>{{sucursal.activo ? 'Activa' : 'Inactiva'}}</td>
          <th>
            <icon-edit [routerLink]="[`/admin/sucursales/${sucursal.id}`]" />
          </th>
          <th>
            <icon-delete [registroId]="sucursal.id" (confirmar)="eliminaRegistro(sucursal.id)" />
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
