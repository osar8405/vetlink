<div class="bg-white rounded-lg shadow-md">
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Roles</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="refrescaDatos()" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
      <a routerLink="/admin/roles/new" class="btn btn-primary">
        <shared-icon-add />
        Nuevo
      </a>
    </div>
  </section>
  <div class="overflow-x-hidden">
    <table class="table ml-5">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Rol</th>
          <th>Editar</th>
          <th>Eliminar</th>
        </tr>
      </thead>
      <tbody>
        @for (rol of rolesResource.value(); track rol.id) {
        <tr>
          <td>{{rol.id}}</td>
          <td>
            {{rol.name}}
          </td>
          <th>
            <icon-edit [routerLink]="[`/admin/roles/${rol.id}`]" />
          </th>
          <th>
            <icon-delete [registroId]="rol.id" (confirmar)="eliminaRegistro(rol.id)" />
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
