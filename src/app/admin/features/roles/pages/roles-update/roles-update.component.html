@if (rolesResource?.error()) {
<shared-not-found-page mensaje="No se encontro el rol solicitado" />
}
@if (!rolesResource?.error()) {
<div class="min-h-screen flex items-center justify-center bg-base-200 p-5">
    <form [formGroup]="myForm" (ngSubmit)="onSubmit()" class="bg-base-100 p-8 rounded-2xl shadow-lg w-full max-w-4xl">
        <h2 class="text-3xl font-bold mb-6">Rol</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            @if (isEditMode) {
            <div>
                <label class="label w-full">ID</label>
                <input type="text" formControlName="id" class="input input-bordered w-auto" readonly />
            </div>
            <div></div>
            }

            <!-- Rol -->
            <div>
                <label class="label">Rol</label>
                <input type="text" formControlName="name" class="input input-bordered w-full" />
                <shared-form-error-label [control]="myForm.get('name')!"></shared-form-error-label>
            </div>
        </div>

        <!-- Botones -->
        <div class="flex justify-end mt-8 gap-4">
            <button type="button" class="btn btn-neutral" (click)="goBack()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
    </form>
</div>
}
