<div class="bg-white rounded-lg shadow-md">
  <section class="flex flex-col md:flex-row items-center justify-between gap-4 p-4">
    <span class="text-center md:text-left w-full md:w-auto text-3xl">Veterinario</span>
    <div class="flex flex-col sm:flex-row items-center justify-end gap-4 w-full md:w-auto">
      <a (click)="refrescaDatos()" class="btn btn-info">
        <shared-icon-refresh />
        Refrescar
      </a>
      <a routerLink="/veterinarios/new" class="btn btn-primary">
        <shared-icon-add />
        Nuevo
      </a>
    </div>
  </section>
  <div class="overflow-x-hidden">
    <table class="table ml-5">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Sucursales</th>
          <th>Cédula</th>
          <th>Editar</th>
          <th>Eliminar</th>
        </tr>
      </thead>
      <tbody>
        @for (veterinario of veterinariosResource.value(); track veterinario.id) {
        <tr>
          <td>{{veterinario.id}}</td>
          <td>
            <div class="flex items-center gap-3">
              <div class="avatar">
                <div class="mask mask-squircle h-12 w-12">
                  <!-- <img src="/assets/images/veterinaria/clinica.jpg" [alt]="veterinario.nombreClinica"
                    class="object-contain " /> -->
                </div>
              </div>
              <div>
                <div class="font-bold">{{veterinario.nombreCompleto}}</div>
              </div>
            </div>
          </td>
          <td>
            {{veterinario.sucursales[0]}}
            <!-- <br />
            <span class="badge badge-ghost badge-sm">{{veterinario.direccion.municipio}}</span> -->
          </td>
          <td>{{veterinario.cedulaProfesional}}</td>
          <th>
            <icon-edit [routerLink]="[`/veterinarios/${veterinario.id}`]" />
          </th>
          <th>
            <icon-delete [registroId]="veterinario.id" (confirmar)="eliminaRegistro(veterinario.id)" />
          </th>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
