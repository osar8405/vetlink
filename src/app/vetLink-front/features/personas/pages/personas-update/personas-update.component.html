@if (personaResource?.error()) {
<shared-not-found-page mensaje="{{personaResource?.error()}}" />
}
@if (!personaResource?.error()) {
<div class="min-h-screen flex items-center justify-center">
  <form [formGroup]="myForm" (ngSubmit)="onSubmit()" class="p-8 rounded-2xl shadow-lg w-full max-w-4xl bg-white">
    <h2 class="text-3xl font-bold mb-6">Datos de la persona</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @if (isEditMode) {
      <div>
        <label class="label">ID</label>
        <input type="text" formControlName="id" class="input input-bordered w-full" readonly />
      </div>
      }

      <!-- nombre -->
      <div>
        <label class="label">Nombre</label>
        <input type="text" formControlName="nombre" class="input input-bordered w-full"
          [class.border-red-500]="myForm.get('nombre')?.errors ?? false" />
        <shared-form-error-label [control]="myForm.get('nombre')!"></shared-form-error-label>
      </div>

      <div>
        <label class="label">Primer apellido</label>
        <input type="text" formControlName="primerApellido" class="input input-bordered w-full"
          [class.border-red-500]="myForm.get('primerApellido')?.errors ?? false" />
        <shared-form-error-label [control]="myForm.get('primerApellido')!"></shared-form-error-label>
      </div>

      <div>
        <label class="label">Segundo apellido</label>
        <input type="text" formControlName="segundoApellido" class="input input-bordered w-full"
          [class.border-red-500]="myForm.get('segundoApellido')?.errors ?? false" />
        <shared-form-error-label [control]="myForm.get('segundoApellido')!"></shared-form-error-label>
      </div>

      <!-- Fecha de nacimiento -->
      <div>
        <label class="label">Fecha de nacimiento</label>
        <input type="date" formControlName="fechaNacimiento" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('fechaNacimiento')!"></shared-form-error-label>
      </div>

      <!-- Numero de identificación -->
      <div>
        <label class="label">Número de identificación</label>
        <input type="text" formControlName="numeroIdentificacion" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('numeroIdentificacion')!"></shared-form-error-label>
      </div>

      <!-- Email -->
      <div>
        <label class="label">Email</label>
        <input type="text" formControlName="email" class="input input-bordered w-full" />
        <shared-form-error-label [control]="myForm.get('email')!"></shared-form-error-label>
      </div>

      <!-- Genero -->
      <div>
        <label class="label">Genero</label>
        <select formControlName="genero" class="select select-bordered w-full">
          <option value="" selected>Seleccione un genero</option>
          <option>Masculino</option>
          <option>Femenino</option>
        </select>
        <shared-form-error-label [control]="myForm.get('genero')!"></shared-form-error-label>
      </div>

      <!-- Tipo usuario -->
      <div>
        <label class="label">Tipo usuario</label>
        <select formControlName="tipoUsuarioId" class="select select-bordered w-full">
          <option value="" selected>Selecciona una opción</option>
          @for (tipoUsuario of tipoUsuarioResource.value(); track tipoUsuario.id) {
          <option [value]="tipoUsuario.id">{{tipoUsuario.nombre}}</option>
          }
        </select>
        <shared-form-error-label [control]="myForm.get('tipoUsuarioId')!"></shared-form-error-label>
      </div>
      <!-- Foto -->
      <shared-select-file [preview]="imagePreview" (imagen)="onFileSelected($event)"></shared-select-file>
    </div>

    <div class="mt-10">
      <h2 class="text-3xl font-bold mb-6 flex flex-col items-center justify-center">Dirección</h2>
      <div formGroupName="direccion" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Calle -->
        <div>
          <label class="label">Calle</label>
          <input type="text" formControlName="calle" class="input input-bordered w-full" />
          <shared-form-error-label [control]="myForm.get('direccion.calle')!"></shared-form-error-label>
        </div>

        <!-- Numero int -->
        <div>
          <label class="label">Numero interior</label>
          <input type="text" formControlName="noInt" class="input input-bordered w-full" />
          <shared-form-error-label [control]="myForm.get('direccion.noInt')!"></shared-form-error-label>
        </div>

        <!-- Numero ext -->
        <div>
          <label class="label">Numero exterior</label>
          <input type="text" formControlName="noExt" class="input input-bordered w-full" />
          <shared-form-error-label [control]="myForm.get('direccion.noExt')!"></shared-form-error-label>
        </div>

        <!-- CP -->
        <div>
          <label class="label">Código Postal</label>
          <input type="number" formControlName="cp" class="input input-bordered w-full" />
          <shared-form-error-label [control]="myForm.get('direccion.cp')!"></shared-form-error-label>
        </div>

        <!-- Colonia -->
        <div>
          <label class="label">Colonia</label>
          <input type="text" formControlName="colonia" class="input input-bordered w-full" />
          <shared-form-error-label [control]="myForm.get('direccion.colonia')!"></shared-form-error-label>
        </div>

        <!-- Municipio -->
        <div>
          <label class="label">Municipio</label>
          <input type="text" formControlName="municipio" class="input input-bordered w-full" />
          <shared-form-error-label [control]="myForm.get('direccion.municipio')!"></shared-form-error-label>
        </div>

        <!-- Estado -->
        <div>
          <label class="label">Estado</label>
          <input type="text" formControlName="estado" class="input input-bordered w-full" />
          <shared-form-error-label [control]="myForm.get('direccion.estado')!"></shared-form-error-label>
        </div>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-end mt-8 gap-4">
      <button type="button" class="btn btn-secundary" (click)="goBack()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
</div>
}
